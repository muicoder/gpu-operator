cdi:
  enabled: false
  nriPluginEnabled: false
dcgmExporter:
  enabled: true
  serviceMonitor:
    enabled: false
devicePlugin:
  config:
    data:
      config.yaml: |
        version: v1
        flags:
          deviceDiscoveryStrategy: auto
          migStrategy: none
  enabled: true
driver:
  enabled: false
gdrcopy:
  enabled: false
gds:
  enabled: false
gfd:
  args:
    - --no-timestamp
    - --sleep-interval=168h
kataManager:
  enabled: false
mig:
  strategy: none
migManager:
  config:
    data:
      config.yaml: |
        version: v1
        mig-configs:
          all-disabled:
            - devices: all
              mig-enabled: false
          mig-1g-5gb:
            - devices: all
              mig-enabled: true
              mig-devices:
                "1g.5gb": 4
          mig-2g-10gb:
            - devices: all
              mig-enabled: true
              mig-devices:
                "2g.10gb": 2
          mixed:
            - devices: [0]
              mig-enabled: false
            - devices: [1]
              mig-enabled: true
              mig-devices:
                "2g.10gb": 2
  enabled: false
nfd:
  enabled: false
  nodefeaturerules: false
nodeStatusExporter:
  enabled: true
operator:
  cleanupCRD: false
  upgradeCRD: false
sandboxDevicePlugin:
  enabled: false
validator:
  args:
    - |
      exec kubectl proxy
vfioManager:
  enabled: false
vgpuDeviceManager:
  enabled: false
vgpuManager:
  enabled: false
